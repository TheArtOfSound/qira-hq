name: Command Center CI

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package*.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/command-center.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package*.json"
      - "tsconfig.json"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
